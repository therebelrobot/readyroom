name: Publish npm

on:
  push:
    tags: ['v*']

# Trusted Publishing (OIDC): id-token: write lets npm exchange the GitHub OIDC
# token for a short-lived publish credential. No NODE_AUTH_TOKEN, no stored secret.
permissions:
  contents: read
  id-token: write

jobs:
  publish:
    name: npm publish
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Node 22
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          registry-url: https://registry.npmjs.org

      - name: Install dependencies
        run: npm ci

      - name: Build
        run: npm run build

      # NOTE: the very first publish must be run interactively (npm login && npm publish)
      # because a trusted-publisher entry can only be configured against a package that
      # already exists on the registry. After that, this workflow publishes via OIDC.
      - name: Publish with provenance
        run: npm publish --provenance --access public
