# Publish to npm with trusted publishing (OIDC) and automatic provenance.
#
# Trigger: pushing a v* tag (e.g. from `npm version patch && git push --follow-tags`).
#
# Shape: two jobs, so the OIDC token never coexists with dependency code.
#   build   - installs deps, runs build + tests, packs the tarball. No id-token.
#   publish - downloads the tarball and publishes it. Has id-token, runs no
#             install and no lifecycle scripts.
#
# npmjs.com trusted publisher must name THIS file (npm-publish.yml, filename only),
# the repo, and the environment below if you keep it. All fields are
# case-sensitive and npm does not validate them until the first publish.
name: npm-publish

on:
  push:
    tags: ['v*']
  # release.yml dispatches this on the tag semantic-release just created. A tag
  # pushed with GITHUB_TOKEN cannot trigger a run on its own, so the release
  # workflow fans out to us explicitly.
  workflow_dispatch:

permissions: {}

# Never cancel a release half way.
concurrency:
  group: npm-publish-${{ github.ref }}
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: latest
          check-latest: true
          package-manager-cache: false # never restore caches into a release build

      - name: Tag must match package.json version
        env:
          REF_NAME: ${{ github.ref_name }}
        run: |
          v="v$(node -p "require('./package.json').version")"
          if [ "$v" != "$REF_NAME" ]; then
            echo "::error::tag $REF_NAME does not match package.json version $v"
            exit 1
          fi

      - run: npm ci
      - run: npm run build --if-present
      - run: npm test --if-present

      - name: Pack
        run: |
          mkdir -p dist-pack
          npm pack --pack-destination dist-pack
          ls -l dist-pack

      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: npm-tarball
          path: dist-pack/*.tgz
          if-no-files-found: error
          retention-days: 7

  publish:
    needs: build
    runs-on: ubuntu-latest # trusted publishing requires GitHub-hosted runners
    timeout-minutes: 10
    # Optional gate. If you keep this line, enter "npm" as the environment name
    # in the npmjs.com trusted publisher, and add required reviewers to the
    # environment in repo Settings > Environments. Delete both or neither.
    environment: npm
    permissions:
      contents: read
      id-token: write # the OIDC token npm exchanges for a one-shot publish token
    steps:
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: latest
          check-latest: true
          registry-url: https://registry.npmjs.org
          package-manager-cache: false

      - name: npm must support trusted publishing (>= 11.5.1)
        run: |
          node -e '
            const [a,b,c] = process.argv[1].split(".").map(Number);
            const ok = a > 11 || (a === 11 && (b > 5 || (b === 5 && c >= 1)));
            if (!ok) { console.error(`::error::npm ${process.argv[1]} is too old for trusted publishing`); process.exit(1); }
          ' "$(npm --version)"

      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: npm-tarball
          path: dist-pack

      - name: Publish
        run: npm publish ./dist-pack/*.tgz --ignore-scripts
