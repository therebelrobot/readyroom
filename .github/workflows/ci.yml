name: CI

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  build:
    name: typecheck, build, worker dry-run, docker build
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Node 22
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Typecheck
        run: npm run typecheck

      - name: Build (Node bundle)
        run: npm run build

      - name: Build (Worker dry-run)
        run: npm run build:worker

      - name: Build container image
        run: docker build -t ghcr.io/therebelrobot/readyroom:ci .
